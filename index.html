<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヨコトキ　行政書士</title>
<style>
  :root {
    --ink: #2a2723;
    --muted: #6b6558;
    --bg: #f7f4ee;
    --card-bg: #ffffff;
    --primary: #1c2e4a;
    --primary-light: #2f4870;
    --review-bg: #eef1f6;
    --accent: #b23a2e;
    --accent-bg: #f7e9e6;
    --incorrect: #b3441e;
    --incorrect-bg: #fbe9e2;
    --border: #ddd6c8;
    --notice: #a6720f;
    --notice-bg: #fdf3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    font-weight: 500;
    background: var(--bg);
    color: var(--ink);
  }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 16px 100px; }
  header h1 {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .02em;
    margin: 0 0 4px;
  }
  .announcement {
    background: var(--notice-bg);
    color: var(--notice);
    border: 1px solid var(--notice);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .filter-selectors { display: flex; gap: 10px; margin-bottom: 20px; }
  .filter-selectors select { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); font-size: 14px; }
  .search-row { margin-bottom: 8px; }
  .search-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--ink); font-size: 16px; font-family: inherit; }
  .search-input:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 2px var(--primary-light) inset; }
  .search-status { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.6; white-space: pre-line; }
  /* テーマごとのメモ */
  .memo { margin: 0 0 16px; }
  .memo-toggle { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 14px; color: var(--ink); text-align: left; cursor: pointer; }
  .memo-toggle-arrow { margin-left: auto; color: var(--muted); transition: transform .15s; }
  .memo-toggle[aria-expanded="true"] .memo-toggle-arrow { transform: rotate(180deg); }
  .memo-badge { font-size: 11px; color: var(--primary); background: var(--review-bg); border-radius: 10px; padding: 2px 8px; }
  .memo-body { margin-top: 8px; padding: 12px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; }
  .memo-view { font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .memo-view a { color: var(--primary-light); text-decoration: underline; }
  .memo-view.empty { color: var(--muted); cursor: pointer; }
  .memo-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .memo-actions[hidden] { display: none; }
  .memo-actions { gap: 8px; }
  .memo-delete-btn { color: var(--incorrect); }
  .memo-delete-confirm { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--incorrect); border-radius: 8px; font-size: 13px; }
  .memo-delete-confirm p { margin: 0 0 8px; }
  .memo-delete-confirm-buttons { display: flex; justify-content: flex-end; gap: 8px; }
  .memo-delete-yes { background: var(--incorrect); color: #fff; border-color: var(--incorrect); }   /* display指定が、hidden属性に勝ってしまうため */
  .memo-textarea { display: block; width: 100%; box-sizing: border-box; min-height: 8em; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink); font-size: 16px; line-height: 1.6; font-family: inherit; resize: vertical; }
  .memo-textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 2px var(--primary-light) inset; }
  .memo-editor-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .memo-status { margin: 8px 0 0; font-size: 12px; color: var(--muted); min-height: 1.2em; }
  .memo-status.error { color: var(--incorrect); }
  .memo-retry-btn { border: 1px solid var(--border); background: var(--card-bg); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--ink); cursor: pointer; }
  /* メモを入力している間は、スマホのキーボードと重ならないよう、画面下の固定バーを隠す */
  body.memo-editing .bucket-bar { display: none; }
  .category-group { margin-bottom: 20px; }
  .category-heading { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .theme-link {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--ink);
    font-size: 14px;
    transition: border-color .15s;
  }
  @media (hover: hover) { .theme-link:hover { border-color: var(--primary-light); } }
  .theme-link-main { display: flex; align-items: center; gap: 8px; }
  /* 検索でヒットしたテーマは、下に、ヒットの内訳を1行出す */
  .theme-link.has-hit { flex-wrap: wrap; }
  .theme-link.has-hit .theme-link-main { flex: 1 1 0; min-width: 0; }
  .theme-link.has-hit .theme-link-right { flex: none; }
  .theme-link-hit { flex-basis: 100%; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .theme-link-star { cursor: pointer; color: #c9ccd1; font-size: 16px; line-height: 1; }
  .theme-link-star.active { color: #f2a93b; }
  .theme-link-lock { font-size: 13px; opacity: .6; }
  .theme-link-right { display: flex; align-items: center; gap: 10px; }
  .theme-link-accuracy { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .theme-link-arrow { color: var(--muted); }
  .list-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .footer-link { text-align: center; margin-top: 32px; font-size: 12px; }
  .footer-link a { color: var(--muted); }
  .list-filters { display: flex; gap: 10px; margin-bottom: 12px; }
  .list-secondary-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .sort-toggle-group { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .sort-toggle-btn {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .sort-toggle-btn.active { color: var(--primary-light); font-weight: 600; }
  .practice-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .back-link {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .mode-toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .reset-progress-btn {
    display: block;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .mode-toggle-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--ink);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 12px;
  }
  .mode-toggle-btn.active { background: var(--review-bg); border-color: var(--primary-light); color: var(--primary); }
  .mode-switch { display: flex; align-items: center; gap: 8px; }
  .mode-badge {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: 4px;
    padding: 6px 12px;
    white-space: nowrap;
    cursor: default;
  }
  .mode-badge.view { background: var(--review-bg); color: var(--primary); }
  .filter-btn { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); font-size: 13px; cursor: pointer; text-align: center; }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .theme-breadcrumb { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  #theme-instruction {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    margin-bottom: 20px;
    white-space: pre-line;
  }
  .buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .bucket {
    position: relative;
    min-height: 90px;
    background: var(--card-bg);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 12px 12px 56px;
    text-align: center;
    cursor: pointer;
    overflow: visible;
    transition: border-color .15s, background .15s;
  }
  .bucket h3 { margin: 0 0 8px; font-size: 15px; color: var(--primary); }
  .bucket-title.masked {
    background: var(--border);
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .bucket.drag-over { border-style: solid; border-color: var(--primary-light); background: #eef4fa; }
  .bucket.selected { border-style: solid; border-color: var(--primary-light); background: #eef4fa; box-shadow: 0 0 0 2px var(--primary-light) inset; }
  /* 不正解のとき、カードが画面の外にあっても気づけるよう、選んだバケツ側で知らせる */
  .bucket.wrong-flash { animation: bucket-wrong .5s ease; border-style: solid; border-color: var(--incorrect); background: var(--incorrect-bg); }
  .bucket-wrong-label { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; font-weight: 600; color: var(--incorrect); pointer-events: none; }
  @keyframes bucket-wrong {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) { .bucket.wrong-flash { animation: none; } }
  .bucket-cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card.sorted {
    position: relative;
    cursor: pointer;
    font-size: 12px;
    padding: 6px 10px;
    background: #fff;
    border-color: var(--border);
    color: var(--ink);
  }
  @media (hover: hover) { .card.sorted:hover { border-color: var(--primary-light); } }
  .card.sorted.highlighted { background: var(--review-bg); border-color: var(--primary-light); color: var(--primary); }

  /* ── 仕分け済みカードの解説を、吹き出しで表示する ── */
  /* 外枠: 位置決めと、矢印の表示だけを担当する(overflowの制約を受けない) */
  .explanation-bubble-wrap {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 12px);
    transform: translateX(calc(-50% + var(--shift, 0px)));
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .12s ease;
  }
  /* 上に、十分なスペースがないとき、下向きに表示する */
  .explanation-bubble-wrap.below {
    bottom: auto;
    top: calc(100% + 12px);
  }
  .explanation-bubble-wrap.show {
    opacity: 1;
    pointer-events: auto;
  }
  .explanation-bubble-wrap::after {
    content: '';
    position: absolute;
    top: 100%;
    left: calc(50% + var(--arrow-offset, 0px));
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: var(--primary);
  }
  /* 下向き表示のときは、矢印も、上を指すように切り替える */
  .explanation-bubble-wrap.below::after {
    top: auto;
    bottom: 100%;
    border-top-color: transparent;
    border-bottom-color: var(--primary);
  }
  .explanation-bubble-wrap.below.incorrect::after { border-bottom-color: var(--incorrect); }
  .explanation-bubble-wrap.incorrect::after { border-top-color: var(--incorrect); }
  /* 本体: 実際の文章を表示し、長文のときはここだけスクロールする */
  .explanation-bubble {
    width: max-content;
    max-width: 240px;
    max-height: 200px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateZ(0);
    background: var(--primary);
    color: #fff;
    font-size: 12.5px;
    line-height: 1.6;
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(28,46,74,.25);
  }
  .explanation-bubble.incorrect { background: var(--incorrect); box-shadow: 0 4px 14px rgba(179,68,30,.25); }
  .deck { display: flex; flex-wrap: wrap; gap: 10px; }
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    cursor: grab;
    user-select: none;
    transition: box-shadow .15s, border-color .15s;
    white-space: pre-line;
  }
  .card.selected { border-color: var(--primary-light); box-shadow: 0 0 0 2px var(--primary-light) inset; }
  .lock-screen {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
  }
  .lock-icon { font-size: 32px; margin-bottom: 12px; }
  .lock-title { font-size: 16px; font-weight: 600; margin: 0 0 6px; color: var(--primary); }
  .lock-desc { font-size: 13px; color: var(--muted); margin: 0 0 24px; }
  .lock-button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  @media (hover: hover) { .lock-button:hover { background: var(--primary-light); } }
  .redeem-form { display: flex; gap: 8px; margin: 20px auto 0; max-width: 320px; }
  .redeem-form input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; }
  .redeem-form button { padding: 10px 16px; border-radius: 8px; border: none; background: var(--primary-light); color: #fff; font-size: 13px; cursor: pointer; }
  .redeem-message { font-size: 13px; margin-top: 12px; }
  .auth-area { margin-bottom: 16px; }
  .auth-status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; margin: 0; }
  .auth-link-btn { background: none; border: none; color: var(--primary); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; }
  .google-login-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  @media (hover: hover) { .google-login-btn:hover { background: #f5f3ee; } }
  .next-theme-row { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 16px; }
  .next-theme-btn {
    display: block;
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--primary-light);
    background: var(--card-bg);
    color: var(--primary-light);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  @media (hover: hover) { .next-theme-btn:hover { background: #eef1f6; } }
  .random-theme-btn { border-color: var(--accent); color: var(--accent); }
  @media (hover: hover) { .random-theme-btn:hover { background: var(--accent-bg); } }
  .theme-bookmark-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .theme-bookmark-btn.active { color: #b8860b; border-color: #f2a93b; }

  /* ── 画面下の固定バー: バケツの名前が、画面から外れたときだけ、バケツ名のボタンを並べて出す ── */
  .bucket-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10; /* 吹き出し(z-index: 20)より奥に置く */
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 14px rgba(28, 46, 74, .14);
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    visibility: hidden;
    transition: transform .2s ease, visibility 0s linear .2s;
  }
  .bucket-bar[hidden] { display: none; }
  .bucket-bar.show { transform: none; visibility: visible; transition: transform .2s ease, visibility 0s; }
  .bucket-bar-inner { display: grid; gap: 6px; max-width: 720px; margin: 0 auto; }
  .bucket-bar-chip {
    min-height: 40px;
    padding: 4px 6px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--primary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
    cursor: pointer;
  }
  .bucket-bar-chip-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bucket-bar-chip.selected { border-color: var(--primary-light); background: #eef4fa; box-shadow: 0 0 0 2px var(--primary-light) inset; }
  .bucket-bar-chip.drag-over { border-color: var(--primary-light); background: #eef4fa; box-shadow: 0 0 0 2px var(--primary-light) inset; }
  .bucket-bar-chip.wrong-flash { animation: bucket-wrong .5s ease; border-color: var(--incorrect); background: var(--incorrect-bg); color: var(--incorrect); }
  /* バーを出している間、ページの一番下のボタンが、バーに隠れないよう、余白を足す */
  body.has-bucket-bar .app { padding-bottom: calc(var(--bucket-bar-h, 0px) + 40px); }
  @media (prefers-reduced-motion: reduce) { .bucket-bar-chip.wrong-flash { animation: none; } .bucket-bar { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ヨコトキ　行政書士</h1>
  </header>
  <div id="auth-area" class="auth-area"></div>

  <div id="list-view">
    <div id="announcement" class="announcement" hidden></div>
    <div class="search-row">
      <input type="search" id="search-input" class="search-input" placeholder="キーワードで検索" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="検索">
    </div>
    <p id="search-status" class="search-status" hidden></p>
    <div class="filter-selectors">
      <select id="filter-category-select"></select>
    </div>
    <div class="list-filters">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="bookmark">★ ブックマーク</button>
    </div>
    <div class="list-secondary-row">
      <div class="sort-toggle-group">
        <button class="sort-toggle-btn" id="sort-toggle-btn">正答率が低い順に並べ替え</button>
        <button class="sort-toggle-btn" id="sort-by-date-btn">最終回答日が古い順に並べ替え</button>
        <button class="sort-toggle-btn" id="sort-by-count-btn">回答回数が少ない順に並べ替え</button>
      </div>
      <div class="mode-switch">
        <span class="mode-badge" id="list-mode-badge">✏️ 仕分け中</span>
        <button class="mode-toggle-btn" id="list-mode-toggle-btn">モード切替</button>
      </div>
    </div>
    <div class="list-secondary-row">
      <span></span>
      <button class="mode-toggle-btn" id="list-shuffle-toggle-btn">🔀 バケツシャッフルOFF</button>
    </div>
    <div id="theme-list"></div>
    <p class="footer-link"><a href="./privacy.html">プライバシーポリシー</a></p>
  </div>

  <div id="practice-view" hidden>
    <div class="practice-top-row">
      <button class="back-link" id="back-to-list-btn">← 一覧へ戻る</button>
      <button class="theme-bookmark-btn" id="theme-bookmark-btn">☆ このテーマをブックマーク</button>
    </div>
    <div class="mode-toggle-row">
      <button class="reset-progress-btn" id="reset-progress-btn">🔄 このテーマの成績をリセット</button>
      <div class="mode-switch">
        <span class="mode-badge" id="mode-badge">✏️ 仕分け中</span>
        <button class="mode-toggle-btn" id="mode-toggle-btn">モード切替</button>
      </div>
    </div>
    <div class="mode-toggle-row">
      <span></span>
      <button class="mode-toggle-btn" id="shuffle-toggle-btn">🔀 バケツをシャッフル</button>
    </div>
    <p id="theme-breadcrumb" class="theme-breadcrumb"></p>
    <div id="theme-instruction">読み込み中...</div>
    <section id="memo" class="memo" hidden>
      <button type="button" id="memo-toggle" class="memo-toggle" aria-expanded="false" aria-controls="memo-body">
        <span>📝 メモ</span>
        <span id="memo-badge" class="memo-badge" hidden>あり</span>
        <span class="memo-toggle-arrow" aria-hidden="true">▾</span>
      </button>
      <div id="memo-body" class="memo-body" hidden>
        <div id="memo-view" class="memo-view"></div>
